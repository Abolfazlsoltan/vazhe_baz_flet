# JNI is pinned in pyproject.toml to keep Android plugin versions compatible.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build APK with Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          cache: false

      - name: Upload APK build archive
        uses: actions/upload-artifact@v7
        with:
          name: vazhe-baz-android-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
