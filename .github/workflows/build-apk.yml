name: Build and test Vazhe-Baz
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q main.py server.py tests .github/scripts/smoke_test.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Flet UI smoke test
        run: python .github/scripts/smoke_test.py
      - name: Build Android APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          cache: false
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vazhe-baz-android-apk
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
