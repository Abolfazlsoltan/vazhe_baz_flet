[project]
name = "vazhe-baz"
version = "2.0.0"
description = "Persian word guessing game with local multiplayer and online rooms"
requires-python = ">=3.10,<3.13"
dependencies = ["flet==0.86.5", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["flet-cli==0.86.5", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[tool.flet]
org = "com.abolfazl.vazhebaz"
product = "واژه‌باز"
company = "Abolfazl"
copyright = "Copyright (C) 2026"

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
